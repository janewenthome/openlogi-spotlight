name: macOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deterministic tests
        run: make test

      - name: Build release binary
        run: swift build --configuration release

      - name: Build app bundle
        run: make app
